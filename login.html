<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login | Aplikasi Perpustakaan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header ">
    <div class="navbar">
        <div class="brand">
            <img src="https://cdn-icons-png.flaticon.com/512/29/29302.png" alt="logo">
            <span>Perpustakaan Digital</span>
        </div>

        <nav class="nav-menu">
            <a href="index.html">Beranda</a>
            <a href="transaksi.html">Transaksi</a>
            <a href="profil.html">Profil</a>
            <a href="login.html" class="btn-login">Login</a>
        </nav>
    </div>
</header>


<div class="login-wrapper">
    <div class="login-box">
        <h2>Login</h2>
        <p class="login-subtitle">Silakan masuk untuk melanjutkan</p>

        <form>
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Masukkan password">
            </div>

            <button type="submit" class="btn-login-small">Masuk</button>
        </form>
    </div>
</div>
<script>
const hamburger = document.getElementById("hamburger");
const navMenu = document.getElementById("navMenu");

hamburger.addEventListener("click", () => {
    navMenu.classList.toggle("active");
    hamburger.classList.toggle("open");
});
</script>
<script src="script.js"></script>
</body>
</html>
